<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div class="contenedor">

<div class="card">
    <h2 class="card-titulo">Registrar / Editar Aprendiz</h2>

    <form th:action="@{/aprendices/guardar}" th:object="${aprendiz}" method="post" class="formulario">

        <input type="hidden" th:field="*{id}">

        <div class="fila-campos">
            <div class="campo">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" required>
            </div>

            <div class="campo">
                <label>Correo</label>
                <input type="email" th:field="*{correo}" required>
            </div>
        </div>

        <div class="fila-campos">
            <div class="campo">
                <label>Ficha</label>
                <input type="text" th:field="*{ficha}" required>
            </div>

            <div class="campo">
                <label>Programa</label>
                <select th:field="*{programa}">
                    <option value="Análisis y Desarrollo de Software">Análisis y Desarrollo de Software</option>
                    <option value="Sistemas">Sistemas</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primario"
                th:text="${aprendiz.id != null} ? 'Actualizar' : 'Guardar'">
        </button>

    </form>
</div>

</div>

</body>
</html>
