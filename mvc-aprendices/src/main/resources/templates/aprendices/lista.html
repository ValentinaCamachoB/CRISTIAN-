<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aprendices - SENA</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div class="contenedor">

    <header class="encabezado">
        <div class="logo-area">
            <span class="icono-sena">🏛️</span>
            <div>
                <h1>Sistema de Aprendices</h1>
                <p>Patrón MVC · Spring Boot · SENA</p>
            </div>
        </div>
        <a th:href="@{/aprendices/nuevo}" class="btn btn-primario">
            + Registrar Aprendiz
        </a>
    </header>

    <div class="tarjetas-resumen">
        <div class="tarjeta-stat">
            <span class="stat-numero" th:text="${total}">0</span>
            <span class="stat-etiqueta">Total</span>
        </div>
        <div class="tarjeta-stat activos">
            <span class="stat-numero" th:text="${activos}">0</span>
            <span class="stat-etiqueta">Activos</span>
        </div>
        <div class="tarjeta-stat inactivos">
            <span class="stat-numero" th:text="${total - activos}">0</span>
            <span class="stat-etiqueta">Inactivos</span>
        </div>
    </div>

    <div class="card">
        <h2 class="card-titulo">Lista de Aprendices</h2>

        <div th:if="${#lists.isEmpty(aprendices)}" class="vacio">
            <p>No hay aprendices registrados aún.</p>
            <a th:href="@{/aprendices/nuevo}" class="btn btn-primario">Registrar el primero</a>
        </div>

        <table th:if="${!#lists.isEmpty(aprendices)}" class="tabla">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Ficha</th>
                    <th>Programa</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aprendiz : ${aprendices}">
                    <td th:text="${aprendiz.id}"></td>
                    <td th:text="${aprendiz.nombre}"></td>
                    <td th:text="${aprendiz.correo}"></td>
                    <td th:text="${aprendiz.ficha}"></td>
                    <td th:text="${aprendiz.programa}"></td>
                    <td>
                        <span th:text="${aprendiz.estado}"
                              th:class="${aprendiz.estaActivo()} ? 'badge activo' : 'badge inactivo'">
                        </span>
                    </td>
                    <td class="acciones">
                        <a th:href="@{/aprendices/detalle/{id}(id=${aprendiz.id})}"
                           class="btn btn-pequeño btn-ver">Ver</a>
                        <a th:href="@{/aprendices/eliminar/{id}(id=${aprendiz.id})}"
                           class="btn btn-pequeño btn-eliminar"
                           onclick="return confirm('¿Eliminar este aprendiz?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
